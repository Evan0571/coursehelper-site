<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      width: 576px;
      height: 1120px;
      margin: 0;
      overflow: hidden;
    }
    body {
      background: #f5f5f5;
      color: #171717;
      font-family:
        -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 90px;
      padding: 0 22px;
      font-size: 19px;
      font-weight: 600;
    }
    .circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 1px #e5e5e5;
    }
    .course {
      font-size: 21px;
      color: #757575;
      margin: 32px 26px 0;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      margin: 35px 26px 34px;
      font-size: 18px;
      color: #505050;
    }
    .counter {
      color: #929292;
      font-size: 16px;
    }
    main {
      border-top: 1px solid #dedede;
      padding: 38px 25px 0;
      perspective: 1400px;
    }
    .card {
      position: relative;
      width: 526px;
      height: 445px;
      border: 1px solid #dedede;
      border-radius: 27px;
      background: #fff;
      box-shadow: 0 5px 15px #24242404;
      transform-origin: center;
    }
    .face {
      position: absolute;
      inset: 0;
      padding: 32px 27px;
    }
    .side {
      color: #777;
      font-size: 14px;
      margin-bottom: 19px;
    }
    .content {
      font-size: 26px;
      line-height: 1.35;
      letter-spacing: -0.6px;
      font-weight: 550;
    }
    .answer .content {
      font-weight: 400;
    }
    .hint {
      font-size: 15px;
      color: #555;
      margin-top: 20px;
    }
    .source {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 22px;
      padding: 30px 0;
      color: #191919;
    }
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      border-top: 1px solid #ddd;
      padding: 27px 25px 26px;
      background: #f5f5f5;
    }
    .cta {
      height: 65px;
      border-radius: 18px;
      background: #141414;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 550;
      position: relative;
    }
    .touch {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      margin: -21px 0 0 -21px;
      border: 2px solid #fff;
      background: #ffffff2a;
      border-radius: 50%;
      opacity: 0;
    }
    .answer {
      display: none;
    }
  </style>
  <body>
    <header>
      <span class="circle"
        ><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7" /></svg></span
      ><span>Review</span
      ><span class="circle"
        ><svg viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="1" />
          <circle cx="12" cy="12" r="1" />
          <circle cx="19" cy="12" r="1" /></svg
      ></span>
    </header>
    <div class="course">Enzymes &amp; cellular energy</div>
    <div class="toolbar">
      <span>Flashcards ⌃</span><span class="counter">1 of 1</span>
    </div>
    <main>
      <div class="card">
        <div class="face question">
          <div class="side">Question</div>
          <div class="content">What do enzymes lower?</div>
        </div>
        <div class="face answer">
          <div class="side">Answer</div>
          <div class="content">Activation energy.</div>
          <div class="hint">Hide answer</div>
        </div>
      </div>
      <div class="source">
        Source evidence<svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></svg>
      </div>
    </main>
    <footer>
      <div class="cta">
        <span class="label">Reveal answer</span><span class="touch"></span>
      </div>
    </footer>
    <script>
      window.renderAt = (t) => {
        const flip = Math.max(0, Math.min(1, (t - 2.15) / 0.65));
        const eased =
          flip < 0.5
            ? 4 * flip * flip * flip
            : 1 - Math.pow(-2 * flip + 2, 3) / 2;
        const back = eased >= 0.5;
        document.querySelector(".question").style.display = back
          ? "none"
          : "block";
        document.querySelector(".answer").style.display = back
          ? "block"
          : "none";
        const angle = back ? 180 * (eased - 1) : 180 * eased;
        document.querySelector(".card").style.transform =
          `rotateY(${angle}deg)`;
        document.querySelector(".label").textContent = back
          ? "Finish set"
          : "Reveal answer";
        const touch = (t - 1.95) / 0.55;
        document.querySelector(".touch").style.opacity =
          touch >= 0 && touch <= 1
            ? String(Math.sin(touch * Math.PI) * 0.8)
            : "0";
        document.querySelector(".touch").style.transform =
          `scale(${0.65 + Math.max(0, touch) * 0.8})`;
      };
      renderAt(0);
    </script>
  </body>
</html>
